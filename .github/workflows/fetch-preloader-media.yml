name: Fetch preloader media

# One-shot asset-recovery helper.
# The dev sandbox this project is edited from can only reach GitHub over TLS, so
# the original preloader media is retrieved here and committed to a temporary
# branch for the local checkout to pick up. Contains no application logic.
#
# Every step is tolerant: whatever is retrieved plus a full diagnostic report is
# always committed, so the outcome can be inspected without the Actions log.

on:
  push:
    paths: ['.github/workflows/fetch-preloader-media.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original media
        run: |
          mkdir -p _media preloader-media
          : > preloader-media/REPORT.txt
          BASE="https://cdn.prod.website-files.com/6a6c76aa5cb26d967c00a2bc"

          grab() { # name url
            name="$1"; url="$2"
            echo "=== $name" >> preloader-media/REPORT.txt
            echo "url: $url" >> preloader-media/REPORT.txt
            code=$(curl -sSL --retry 3 --retry-delay 2 -H 'Accept: */*' \
                        -o "_media/$name" -w '%{http_code} %{size_download} %{content_type}' "$url" 2>>preloader-media/REPORT.txt || echo "CURL_FAIL")
            echo "result: $code" >> preloader-media/REPORT.txt
            ls -la "_media/$name" >> preloader-media/REPORT.txt 2>&1 || true
            echo >> preloader-media/REPORT.txt
          }

          grab g.webm "$BASE%2F6aa1331eea1ef789891cc2ee_G_webm.webm"
          grab g.mp4  "$BASE%2F6aa1331eea1ef789891cc2ee_G_mp4.mp4"
          grab poster.avif "$BASE/6aa28bda9935b5d07a54c57c_frame0000.avif"

          echo "=== contents of _media" >> preloader-media/REPORT.txt
          ls -la _media >> preloader-media/REPORT.txt 2>&1 || true
          cat preloader-media/REPORT.txt

      - name: Inspect media
        run: |
          exec >> preloader-media/REPORT.txt 2>&1
          echo "=== file(1)"
          file _media/* 2>&1 || echo "file(1) unavailable"
          echo "=== magic bytes (first 16)"
          for f in _media/*; do printf '%s: ' "$f"; xxd -l 16 -p "$f" 2>/dev/null || echo "(xxd unavailable)"; done
          echo "=== html/error-page check"
          for f in _media/*; do
            if head -c 300 "$f" 2>/dev/null | grep -qiE '<!doctype|<html|AccessDenied'; then
              echo "HTML-ERROR-PAGE: $f"
            else
              echo "binary-ok: $f"
            fi
          done
          echo "=== ffprobe version"
          ffprobe -version 2>&1 | head -2 || echo "ffprobe NOT INSTALLED"
          for f in _media/g.webm _media/g.mp4 _media/poster.avif; do
            echo "=== ffprobe $f"
            ffprobe -v error -show_entries \
              "format=format_name,duration,size,bit_rate:stream=codec_name,codec_type,codec_long_name,width,height,r_frame_rate,nb_frames" \
              -of default=noprint_wrappers=1 "$f" 2>&1 || echo "(ffprobe failed)"
          done
          echo "=== done inspecting"

      - name: Convert poster AVIF to PNG
        run: |
          exec >> preloader-media/REPORT.txt 2>&1
          echo "=== poster conversion"
          if ffmpeg -v error -y -i _media/poster.avif _media/g-frame.png 2>&1 && [ -s _media/g-frame.png ]; then
            echo "converted via ffmpeg"
          else
            echo "ffmpeg failed, trying Pillow"
            pip install --quiet pillow-avif-plugin 2>&1 || true
            python3 - <<'PY' 2>&1 || echo "Pillow conversion failed"
          try:
              import pillow_avif  # noqa: F401
          except Exception as e:
              print("pillow_avif import:", e)
          from PIL import Image
          im = Image.open('/home/runner/work/_temp/poster.avif') if False else Image.open('_media/poster.avif')
          im.save('_media/g-frame.png')
          print("converted with Pillow:", im.size, im.mode)
          PY
          fi
          echo "=== poster result"
          file _media/g-frame.png 2>&1 || true
          python3 -c "from PIL import Image;im=Image.open('_media/g-frame.png');print('poster PNG:',im.size,im.mode)" 2>&1 || true

      - name: Publish artifacts to recovery branch
        run: |
          set -x
          git config user.name  "media-recovery-bot"
          git config user.email "media-recovery-bot@users.noreply.github.com"
          git checkout -B media-recovery
          for f in g.webm g.mp4 g-frame.png; do
            [ -s "_media/$f" ] && cp "_media/$f" "preloader-media/$f" || echo "missing: $f" >> preloader-media/REPORT.txt
          done
          ls -la preloader-media >> preloader-media/REPORT.txt 2>&1
          git add -f preloader-media
          git commit -m "chore: recovered original preloader media" || echo "nothing to commit"
          git push --force origin media-recovery
