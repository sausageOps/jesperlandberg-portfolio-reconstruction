name: Fetch preloader media

# One-shot asset-recovery helper.
# The dev sandbox this project is edited from can only reach GitHub over TLS, so
# the original preloader media is retrieved here and committed to a temporary
# branch for the local checkout to pick up. Contains no application logic.

on:
  push:
    paths: ['.github/workflows/fetch-preloader-media.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original media
        run: |
          set -euo pipefail
          mkdir -p _media
          BASE="https://cdn.prod.website-files.com/6a6c76aa5cb26d967c00a2bc"
          WEBM="$BASE%2F6aa1331eea1ef789891cc2ee_G_webm.webm"
          MP4="$BASE%2F6aa1331eea1ef789891cc2ee_G_mp4.mp4"
          AVIF="$BASE/6aa28bda9935b5d07a54c57c_frame0000.avif"

          fetch() { # url outfile
            curl -sSL --fail --retry 3 --retry-delay 2 \
                 -H 'Accept: */*' \
                 -o "$2" -w "%{http_code} %{size_download} %{content_type} <- $1\n" "$1"
          }

          fetch "$WEBM" _media/g.webm
          fetch "$MP4"  _media/g.mp4
          fetch "$AVIF" _media/poster.avif

      - name: Verify genuine media
        run: |
          set -euo pipefail
          ls -la _media
          echo '--- file(1) ---'
          file _media/*
          echo '--- magic bytes ---'
          for f in _media/*; do printf '%s: ' "$f"; xxd -l 16 -p "$f"; done
          # Reject HTML error pages masquerading as media.
          for f in _media/*; do
            if head -c 200 "$f" | grep -qiE '<!doctype|<html|AccessDenied|error'; then
              echo "::error::$f is an HTML/error page, not media"; exit 1
            fi
          done
          echo "--- ffprobe ---"
          for f in _media/g.webm _media/g.mp4; do
            echo "== $f"; ffprobe -v error -show_entries \
              format=format_name,duration,size,bit_rate:stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames \
              -of default=noprint_wrappers=1 "$f" || echo "ffprobe failed on $f (fatal)" 
            ffprobe -v error -show_entries format=format_name -of csv=p=0 "$f" >/dev/null || exit 1
          done
          echo "--- avif ---"
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 _media/poster.avif || true

      - name: Convert poster AVIF to PNG
        run: |
          set -euo pipefail
          if ffmpeg -v error -y -i _media/poster.avif _media/g-frame.png 2>/dev/null && [ -s _media/g-frame.png ]; then
            : # converted with ffmpeg
          else
            pip install --quiet pillow-avif-plugin 2>/dev/null || true
            python3 - <<'PY'
          try:
              import pillow_avif  # noqa: F401
          except Exception:
              pass
          from PIL import Image
          im = Image.open('_media/poster.avif')
          im.save('_media/g-frame.png')
          print('converted with Pillow', im.size, im.mode)
          PY
          fi
          file _media/g-frame.png
          python3 -c "from PIL import Image; im=Image.open('_media/g-frame.png'); print('poster PNG:', im.size, im.mode)"

      - name: Commit to recovery branch
        run: |
          set -euo pipefail
          git config user.name  "media-recovery-bot"
          git config user.email "media-recovery-bot@users.noreply.github.com"
          git checkout -B media-recovery
          mkdir -p preloader-media
          cp _media/g.webm       preloader-media/g.webm
          cp _media/g.mp4        preloader-media/g.mp4
          cp _media/g-frame.png  preloader-media/g-frame.png
          rm -rf _media
          git add -f preloader-media
          git commit -m "chore: recovered original preloader media (webm, mp4, poster)"
          git push --force origin media-recovery
