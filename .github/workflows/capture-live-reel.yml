name: Capture live reel

# Records the LIVE reference site's preloader reel animation frame-by-frame.
# Needed because the dev sandbox cannot reach the reference host over TLS.
# Analysis helper only - contains no application logic.

on:
  push:
    paths:
      - '.github/workflows/capture-live-reel.yml'
      - '.github/workflows/cap-live-reel.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture
        continue-on-error: true
        run: |
          mkdir -p out
          exec >> out/REPORT.txt 2>&1
          echo "=== node"; node -v
          echo "=== reachability of live site"
          curl -s -o /dev/null -m 25 -w 'live http=%{http_code}\n' https://gif.garajedeideas.com/ || echo "curl failed"
          echo "=== install puppeteer"
          npm i --no-audit --no-fund puppeteer@23 2>&1 | tail -4
          echo "=== run capture"
          node .github/workflows/cap-live-reel.mjs
          echo "=== exit=$?"
          ls -la out

      - name: Publish
        if: always()
        run: |
          git config user.name  "reel-capture-bot"
          git config user.email "reel-capture-bot@users.noreply.github.com"
          git checkout -B reel-capture
          rm -rf reel-capture
          mkdir -p reel-capture
          cp out/* reel-capture/ 2>/dev/null || echo "no out files"
          rm -rf out
          git add -f reel-capture
          git commit -m "chore: live reference reel capture" || echo "nothing to commit"
          git push --force origin reel-capture
